name: Évaluation

# Indexe le corpus BOFiP avec les vrais modèles (embeddings e5, reranker cross-encoder), puis mesure la
# qualité de recherche, l'abstention et, si une clé LLM est fournie en secret, la génération (A/B des prompts).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["eval/questions.jsonl", "src/**", "prompts/**", "data/bofip_subset.jsonl.gz"]

permissions:
  contents: write

concurrency:
  group: eval
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAG_LLM_PROVIDER: ${{ secrets.RAG_LLM_API_KEY && 'gemini' || 'none' }}
      RAG_LLM_API_KEY: ${{ secrets.RAG_LLM_API_KEY }}
      # Modèle distinct de celui de Mail Track AI : chaque modèle a son propre quota gratuit.
      RAG_LLM_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-mmarco-v1
      - name: Évaluer
        run: |
          if [ "$RAG_LLM_PROVIDER" = "gemini" ]; then python eval/run_eval.py --llm; else python eval/run_eval.py; fi
      - name: Versionner le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/REPORT.md eval/results.json
          git diff --cached --quiet || git commit -m "eval: rapport mis à jour [skip ci]"
          git pull --rebase && git push
