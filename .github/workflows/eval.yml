name: Évaluation

# Indexe le corpus BOFiP avec les vrais modèles (embeddings e5, reranker cross-encoder), puis mesure la
# qualité de recherche et l'abstention. La génération (A/B des prompts) n'est évaluée que sur demande,
# avec une clé LLM en secret, car le quota gratuit de Gemini est limité à 20 requêtes par jour.
on:
  workflow_dispatch:
    inputs:
      llm:
        description: "Évaluer aussi la génération (consomme environ 16 requêtes Gemini)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["eval/questions.jsonl", "src/**", "prompts/**", "data/bofip_subset.jsonl.gz"]

permissions:
  contents: write

concurrency:
  group: eval
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      RAG_QDRANT_PATH: .qdrant_eval
      RAG_LLM_PROVIDER: ${{ (inputs.llm && secrets.RAG_LLM_API_KEY) && 'gemini' || 'none' }}
      RAG_LLM_API_KEY: ${{ secrets.RAG_LLM_API_KEY }}
      # Modèle distinct de celui de Mail Track AI : chaque modèle a son propre quota gratuit.
      RAG_LLM_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - name: Cache des modèles
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-mmarco-v1
      - name: Cache de l'index (reconstruit seulement si le corpus ou le découpage change)
        uses: actions/cache@v4
        with:
          path: .qdrant_eval
          key: index-${{ hashFiles('data/bofip_subset.jsonl.gz', 'src/rag_fiscal/ingest/**', 'src/rag_fiscal/index/**') }}
      - name: Évaluer
        run: |
          if [ "$RAG_LLM_PROVIDER" = "gemini" ]; then python eval/run_eval.py --llm; else python eval/run_eval.py; fi
      - name: Versionner le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/REPORT.md eval/results.json
          git diff --cached --quiet || git commit -m "eval: rapport mis à jour [skip ci]"
          git pull --rebase && git push
